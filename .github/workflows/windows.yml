name: Windows build
on:
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Run all tests, native proxy checks and portable launcher smoke tests'
        type: boolean
        default: false
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve application version
        id: version
        shell: pwsh
        run: |
          $requested = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          $version = ./scripts/build-version.ps1 -Version $requested
          "version=$($version.Label)" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Verify version resolution
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        run: ./scripts/test-build-version.ps1
        shell: pwsh
      - name: Verify release credential build rules
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        run: ./scripts/test-release-credentials.ps1
        shell: pwsh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - name: Verify native WinHTTP error capture
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        run: ./scripts/test-system-proxy.ps1
        shell: pwsh
      - name: Run core regression tests
        run: |
          $arguments = @('test', '--no-pub', '--reporter', 'expanded', "--dart-define=MC_DOWNLOAD_VERSION=$env:APP_VERSION")
          if ($env:FULL_CHECKS -ne 'true') {
            $arguments += @(
              'test/network_test.dart',
              'test/installation_test.dart',
              'test/modpack_chain_test.dart',
              'test/curseforge_test.dart',
              'test/download_recovery_test.dart',
              'test/release_credentials_test.dart'
            )
          }
          & flutter @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          FULL_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks }}
      - name: Verify portable launcher
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        run: ./scripts/test-portable.ps1
        shell: pwsh
      - name: Verify bundled credential behavior
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        run: |
          flutter test --no-pub test/release_credentials_test.dart --dart-define=MC_DOWNLOAD_VERSION=0.1.0 --dart-define=MC_DOWNLOAD_CF_PAYLOAD=YmsuYmx+c317byZnaHc= --dart-define=MC_DOWNLOAD_CF_MASK=AQIDBAUGBwgJCgsMDQ4=
          if ($LASTEXITCODE -ne 0) { throw 'Bundled credential tests failed.' }
          flutter test --no-pub test/release_credentials_test.dart --dart-define=MC_DOWNLOAD_VERSION=dev --dart-define=MC_DOWNLOAD_CF_PAYLOAD=YmsuYmx+c317byZnaHc= --dart-define=MC_DOWNLOAD_CF_MASK=AQIDBAUGBwgJCgsMDQ4=
          if ($LASTEXITCODE -ne 0) { throw 'DEV credential isolation tests failed.' }
        shell: pwsh
      - name: Build development application
        if: steps.version.outputs.version == 'dev'
        run: ./scripts/build-windows.ps1 -SkipChecks -NoPub -Version $env:APP_VERSION
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
      - name: Build tagged application with bundled authorization
        if: github.ref_type == 'tag' && steps.version.outputs.version != 'dev'
        run: ./scripts/build-windows.ps1 -SkipChecks -NoPub -Version $env:APP_VERSION -EmbedCurseForgeKey
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: MC-Download-${{ steps.version.outputs.version }}-Windows-x64
          path: orther/releases/MC Download ${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MC-Download-${{ needs.build.outputs.version }}-Windows-x64
          path: orther/releases
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $asset = "orther/releases/MC Download $env:APP_VERSION.exe"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset --clobber
          } else {
            $arguments = @('release', 'create', $env:RELEASE_TAG, $asset, '--verify-tag', '--generate-notes', '--title', "MC Download $env:APP_VERSION")
            if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
            gh @arguments
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
