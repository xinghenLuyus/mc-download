name: Defender diagnostic
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Actions run ID containing the reported MC Download artifact'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the original build without executing it
        uses: actions/download-artifact@v4
        with:
          pattern: MC-Download-*-Windows-x64
          merge-multiple: true
          path: orther/cache/defender-input
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Scan original artifact
        shell: pwsh
        env:
          SCAN_SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: ./scripts/test-defender.ps1 -Path orther/cache/defender-input -ReportFile orther/cache/defender/original-artifact.json -SourceRunId $env:SCAN_SOURCE_RUN_ID
      - name: Preserve scan result and sample hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Defender-diagnostics-${{ inputs.run_id }}-${{ github.run_attempt }}
          path: orther/cache/defender/*.json
          if-no-files-found: ignore
